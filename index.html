<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Squirrel Banking App</title>
</head>
<body>
  <h1>Squirrel Banking App</h1>

  <h2>Trang đăng nhập</h2>
  <form>
    <label>Email:</label><br>
    <input type="email" placeholder="Nhập email"><br><br>

    <label>Mật khẩu:</label><br>
    <input type="password" placeholder="Nhập mật khẩu"><br><br>

    <button type="button">Đăng nhập</button>
  </form>

  <hr>

  <h2>Thông tin tài khoản</h2>
  <p>Chủ tài khoản: Basculin</p>
  <p>Số tài khoản: 0123456789</p>
  <p>Số dư: 25,450,000 VNĐ</p>

  <hr>

  <h2>Thêm giao dịch</h2>
  <form>
    <label>Tên giao dịch:</label><br>
    <input type="text" placeholder="Ví dụ: Thanh toán Shopee"><br><br>

    <label>Số tiền:</label><br>
    <input type="number" placeholder="Nhập số tiền"><br><br>

    <label>Loại giao dịch:</label><br>
    <select>
      <option>Thu nhập</option>
      <option>Chi tiêu</option>
    </select><br><br>

    <button type="button">Lưu giao dịch</button>
  </form>
</body>
</html>

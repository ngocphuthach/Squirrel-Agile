<rect x="780" y="180" width="260" height="100" rx="20" fill="white"/>

<text x="820" y="225" font-family="Poppins, Arial" font-size="18" fill="#777777">
Income
</text>

<text x="820" y="260" font-family="Poppins, Arial" font-size="30" font-weight="700" fill="#111111">
+$3,200
</text>

<!-- Expense Card -->
<rect x="1080" y="180" width="260" height="100" rx="20" fill="white"/>

<text x="1120" y="225" font-family="Poppins, Arial" font-size="18" fill="#777777">
Expense
</text>

<text x="1120" y="260" font-family="Poppins, Arial" font-size="30" font-weight="700" fill="#111111">
-$1,250
</text>


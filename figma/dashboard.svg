<text x="120" y="92" font-family="Poppins, Arial" font-size="28" font-weight="700" fill="white">
Squirrel Bank
</text>

<!-- Menu -->
<text x="60" y="180" font-family="Poppins, Arial" font-size="20" fill="white">
Dashboard
</text>

<text x="60" y="240" font-family="Poppins, Arial" font-size="20" fill="#D9CFFF">
Transactions
</text>

<text x="60" y="300" font-family="Poppins, Arial" font-size="20" fill="#D9CFFF">
Cards
</text>

<text x="60" y="360" font-family="Poppins, Arial" font-size="20" fill="#D9CFFF">
Settings
</text>

<!-- Header -->
<text x="320" y="90" font-family="Poppins, Arial" font-size="40" font-weight="700" fill="#111111">
Dashboard
</text>

<text x="320" y="130" font-family="Poppins, Arial" font-size="18" fill="#777777">
Welcome back, Arcanine
</text>

<!-- Balance Card -->
<rect x="320" y="180" width="420" height="220" rx="24" fill="#5B35D5"/>

<text x="360" y="250" font-family="Poppins, Arial" font-size="22" fill="white">

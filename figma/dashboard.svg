<rect x="320" y="450" width="1020" height="420" rx="24" fill="white"/>

<text x="360" y="510" font-family="Poppins, Arial" font-size="28" font-weight="700" fill="#111111">
Recent Transactions
</text>

<!-- Transaction Rows -->
<rect x="360" y="560" width="940" height="70" rx="14" fill="#F7F5FC"/>
<text x="390" y="605" font-family="Poppins, Arial" font-size="18" fill="#111111">
Netflix Subscription
</text>
<text x="1180" y="605" font-family="Poppins, Arial" font-size="18" fill="#E74C3C">
-$15
</text>

<rect x="360" y="660" width="940" height="70" rx="14" fill="#F7F5FC"/>
<text x="390" y="705" font-family="Poppins, Arial" font-size="18" fill="#111111">
Salary Deposit
</text>
<text x="1180" y="705" font-family="Poppins, Arial" font-size="18" fill="#2ECC71">
+$2,500
</text>

<rect x="360" y="760" width="940" height="70" rx="14" fill="#F7F5FC"/>
<text x="390" y="805" font-family="Poppins, Arial" font-size="18" fill="#111111">
